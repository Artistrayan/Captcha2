services:
  - type: web
    name: shieldcaptcha-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shieldcaptcha-db
          property: connectionString
      - key: CAPTCHA_SERVER_SALT
        generateValue: true
      - key: SESSION_JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: RATE_LIMIT_CHALLENGES_PER_MIN
        value: "20"
      - key: RATE_LIMIT_VERIFY_PER_MIN
        value: "30"
      - key: APP_URL
        sync: false

databases:
  - name: shieldcaptcha-db
    plan: free
    region: oregon
