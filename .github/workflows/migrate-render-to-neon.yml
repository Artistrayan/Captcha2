name: Migrate legacy PostgreSQL to Neon test branch

on:
  push:
    branches:
      - migration-run-once
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE_TO_MIGRATION_TEST to authorize restoring into the isolated migration-test branch'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'RESTORE_TO_MIGRATION_TEST' || github.ref == 'refs/heads/migration-run-once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate connection secrets
        env:
          SOURCE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          TARGET_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_URL" || { echo "Missing RENDER_DATABASE_URL secret"; exit 1; }
          test -n "$TARGET_URL" || { echo "Missing NEON_DATABASE_URL secret"; exit 1; }
          case "$SOURCE_URL" in postgresql://*|postgres://*) ;; *) echo "Source must be a PostgreSQL connection URL"; exit 1;; esac
          case "$TARGET_URL" in postgresql://*|postgres://*) ;; *) echo "Target must be a PostgreSQL connection URL"; exit 1;; esac
          SOURCE_HOST="$(printf '%s' "$SOURCE_URL" | sed -E 's#^[^:]+://([^/@]+@)?([^:/?]+).*#\2#')"
          TARGET_HOST="$(printf '%s' "$TARGET_URL" | sed -E 's#^[^:]+://([^/@]+@)?([^:/?]+).*#\2#')"
          if [ "$SOURCE_HOST" = "$TARGET_HOST" ]; then
            echo "Source and target hosts are identical; refusing to proceed."
            exit 1
          fi

      - name: Dump legacy source with matching PostgreSQL 18 client
        env:
          SOURCE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/migration"
          docker run --rm -e SOURCE_URL -v "$RUNNER_TEMP/migration:/backup" postgres:18 \
            pg_dump --no-owner --no-acl --format=custom "$SOURCE_URL" --file=/backup/source.dump
          test -s "$RUNNER_TEMP/migration/source.dump"

      - name: Restore into Neon migration-test target
        env:
          TARGET_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # pg_restore must use the direct Neon endpoint; convert a copied pooled URL safely if needed.
          TARGET_URL="${TARGET_URL/-pooler./.}"
          docker run --rm -e TARGET_URL -v "$RUNNER_TEMP/migration:/backup" postgres:18 \
            pg_restore --verbose --no-owner --no-acl --clean --if-exists --exit-on-error \
            --dbname="$TARGET_URL" /backup/source.dump

      - name: Verify restored schema and key table counts
        env:
          TARGET_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # pg_restore/verification use the direct Neon endpoint, not PgBouncer.
          TARGET_URL="${TARGET_URL/-pooler./.}"
          docker run --rm -e TARGET_URL postgres:18 psql "$TARGET_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT current_database() AS database, current_schema() AS schema, version();"
          docker run --rm -e TARGET_URL postgres:18 psql "$TARGET_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;"
          docker run --rm -e TARGET_URL postgres:18 psql "$TARGET_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT 'users' AS table_name, count(*) FROM public.users UNION ALL SELECT 'sites', count(*) FROM public.sites UNION ALL SELECT 'captcha_challenges', count(*) FROM public.captcha_challenges UNION ALL SELECT 'captcha_billing_usage', count(*) FROM public.captcha_billing_usage UNION ALL SELECT 'billing_invoices', count(*) FROM public.billing_invoices UNION ALL SELECT 'captcha_free_trial_usage', count(*) FROM public.captcha_free_trial_usage UNION ALL SELECT 'support_tickets', count(*) FROM public.support_tickets UNION ALL SELECT 'api_keys', count(*) FROM public.api_keys;"
