name: CI

on:
  push:
    branches: [main, security-hardening-oct-2026]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Security and regression tests
        run: rm -rf .data && NODE_ENV=test bun run test -- --no-file-parallelism
      - name: Production build
        run: bun run build
